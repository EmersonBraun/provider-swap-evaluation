<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Different providers, different failure profiles</title>
  <desc id="description">OpenRouter completed 28 correct requests and timed out twice. Gemini completed all terminal states but had three strict-output failures and one explicit provider error.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #475467; }
    .label { font-size: 16px; font-weight: 650; }
    .small { font-size: 14px; fill: #475467; }
    .metric { font-size: 22px; font-weight: 700; }
  </style>
  <text x="48" y="56" class="title">Different providers, different failure profiles</text>
  <text x="48" y="88" class="subtitle">A single success rate would hide the distinction between task, terminal, and provider failures.</text>
  <rect x="48" y="135" width="510" height="400" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="84" y="185" class="title">OpenRouter</text>
  <text x="84" y="220" class="subtitle">openai/gpt-oss-20b:free</text>
  <text x="84" y="285" class="metric" fill="#059669">28 correct completions</text>
  <text x="84" y="335" class="metric" fill="#dc2626">2 request timeouts</text>
  <text x="84" y="385" class="label">28/30 valid terminals</text>
  <text x="84" y="430" class="small">Both timeouts occurred on the same</text>
  <text x="84" y="454" class="small">case-sensitive string reversal case.</text>
  <rect x="642" y="135" width="510" height="400" rx="18" fill="#f8fafc" stroke="#d97706" stroke-width="3"/>
  <text x="678" y="185" class="title">Gemini</text>
  <text x="678" y="220" class="subtitle">gemini-3.5-flash-lite</text>
  <text x="678" y="285" class="metric" fill="#059669">26 correct completions</text>
  <text x="678" y="335" class="metric" fill="#dc2626">3 strict-output failures</text>
  <text x="678" y="385" class="metric" fill="#dc2626">1 explicit provider error</text>
  <text x="678" y="430" class="label">30/30 valid terminals</text>
  <text x="678" y="475" class="small">The explicit error failed the user task</text>
  <text x="678" y="499" class="small">but satisfied the stream contract.</text>
  <text x="48" y="590" class="label">Architectural portability preserved the comparison—it did not erase provider differences.</text>
</svg>
