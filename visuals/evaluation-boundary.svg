<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">One evaluation boundary, two provider paths</title>
  <desc id="description">The dataset, prompt, scorers, and invocation remain unchanged while separate adapters connect to OpenRouter and Gemini.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #475467; }
    .label { font-size: 16px; font-weight: 650; }
    .small { font-size: 14px; fill: #475467; }
    .metric { font-size: 22px; font-weight: 700; }
  </style>
  <text x="48" y="56" class="title">One evaluation boundary, two provider paths</text>
  <text x="48" y="88" class="subtitle">Only the adapter configuration changes. Evaluation inputs and outputs keep the same contract.</text>
  <rect x="60" y="150" width="230" height="90" rx="14" fill="#f8fafc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="175" y="184" text-anchor="middle" class="label">Dataset</text>
  <text x="175" y="209" text-anchor="middle" class="small">10 synthetic cases</text>
  <rect x="350" y="150" width="230" height="90" rx="14" fill="#f8fafc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="465" y="184" text-anchor="middle" class="label">Evaluation</text>
  <text x="465" y="209" text-anchor="middle" class="small">shared prompt + scorers</text>
  <rect x="640" y="150" width="230" height="90" rx="14" fill="#f8fafc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="755" y="184" text-anchor="middle" class="label">Adapter contract</text>
  <text x="755" y="209" text-anchor="middle" class="small">stream + abort + terminal</text>
  <path d="M290 195 H350 M580 195 H640" stroke="#101828" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 240 V310 H440 V350 M755 310 H1000 V350" fill="none" stroke="#101828" stroke-width="3"/>
  <rect x="325" y="350" width="230" height="90" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="384" text-anchor="middle" class="label">OpenRouter</text>
  <text x="440" y="409" text-anchor="middle" class="small">gpt-oss-20b:free</text>
  <rect x="885" y="350" width="230" height="90" rx="14" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="1000" y="384" text-anchor="middle" class="label">Gemini API</text>
  <text x="1000" y="409" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <path d="M440 440 V505 H720 M1000 440 V505 H720" fill="none" stroke="#101828" stroke-width="3"/>
  <rect x="590" y="500" width="260" height="90" rx="14" fill="#f8fafc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="720" y="534" text-anchor="middle" class="label">Comparable evidence</text>
  <text x="720" y="559" text-anchor="middle" class="small">accuracy, terminal, latency</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#101828"/></marker></defs>
</svg>
